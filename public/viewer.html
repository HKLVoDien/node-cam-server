<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>FaceCam - Viewer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥️</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

  video { width: 100vw; height: 100vh; object-fit: cover; transition: transform 0.2s; }

  #controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    align-items: center;
    background: rgba(10,10,10,0.7);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 8px 12px;
    border-radius: 20px;
  }

  .ctrl-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,0.08);
    border: none;
    color: #ccc;
    padding: 7px 13px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.14); color: #fff; }
  .ctrl-btn.active { background: #3b82f6; color: #fff; }

  .ctrl-divider {
    width: 1px;
    height: 24px;
    background: rgba(255,255,255,0.1);
    margin: 0 2px;
  }

  #status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #666;
    padding: 0 6px;
    white-space: nowrap;
  }
  #stats {
    font-size: 11px;
    color: #555;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: nowrap;
    padding: 0 2px;
  }
  #stats:empty { display: none; }

  #status .dot { width: 7px; height: 7px; border-radius: 50%; background: #555; flex-shrink: 0; }
  #status.live .dot { background: #22c55e; box-shadow: 0 0 6px #22c55e88; animation: pulse 2s infinite; }
  #status.error .dot { background: #ef4444; }
  #status.live { color: #fff; }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .hide-btn {
    background: transparent;
    border: none;
    color: #555;
    width: 28px; height: 28px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .hide-btn:hover { background: rgba(255,255,255,0.08); color: #ccc; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>

<div id="controls">
  <div id="status"><div class="dot"></div> Chờ phone...</div>
  <div id="stats"></div>
  <div class="ctrl-divider"></div>
  <button class="ctrl-btn" id="flipH">⇔ Flip H</button>
  <button class="ctrl-btn" id="flipV">⇕ Flip V</button>
  <button class="ctrl-btn" id="rot90">↻ 90°</button>
  <div class="ctrl-divider"></div>
  <button class="hide-btn" id="hideBtn" title="Ẩn controls (double-click để hiện lại)">✕</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/shared.js"></script>
<script>
const { ROOM, ROLE, EV, RTC_CONFIG, fetchConfig, saveConfig } = FaceCam
const socket = io()
const video = document.getElementById('video')
const statusEl = document.getElementById('status')
const statsEl = document.getElementById('stats')

let pc = null
let phoneId = null        // socket id của phone — cần để gửi answer/ICE đích danh
let retryTimer = null
let statsTimer = null
let pendingIce = []
let fH = false, fV = false, rot = 0

function applyTransform() {
  // rotate() không đổi layout box → ở 90/270 phải hoán đổi kích thước element
  // trước khi xoay, nếu không object-fit: cover sẽ crop/kéo giãn sai khung hình
  const swap = rot === 90 || rot === 270
  video.style.width = swap ? '100vh' : '100vw'
  video.style.height = swap ? '100vw' : '100vh'
  video.style.transform = `rotate(${rot}deg) scaleX(${fH ? -1 : 1}) scaleY(${fV ? -1 : 1})`
}

function setStatus(text, state = '') {
  statusEl.innerHTML = '<div class="dot"></div>'
  statusEl.append(text)
  statusEl.className = state
}

// Lưu xong phải báo cho control.html/phone, nếu không UI của chúng vẫn hiện giá
// trị cũ cho tới khi người dùng tự F5
function pushConfig(patch) {
  saveConfig(patch)
    .then(() => socket.emit(EV.CONFIG_UPDATED))
    .catch(e => console.warn('Lưu config thất bại:', e.message))
}

const controls = document.getElementById('controls')

fetchConfig().then(cfg => {
  fH = cfg.flipH ?? false
  fV = cfg.flipV ?? false
  rot = cfg.rotation ?? 0
  document.getElementById('flipH').classList.toggle('active', fH)
  document.getElementById('flipV').classList.toggle('active', fV)
  if (cfg.hideControls) controls.style.display = 'none'
  applyTransform()
}).catch(e => console.warn('Không tải được config:', e.message))

document.getElementById('flipH').addEventListener('click', function() {
  fH = !fH; this.classList.toggle('active', fH); applyTransform(); pushConfig({ flipH: fH })
})
document.getElementById('flipV').addEventListener('click', function() {
  fV = !fV; this.classList.toggle('active', fV); applyTransform(); pushConfig({ flipV: fV })
})
document.getElementById('rot90').addEventListener('click', function() {
  rot = (rot + 90) % 360; applyTransform(); pushConfig({ rotation: rot })
})
document.getElementById('hideBtn').addEventListener('click', () => {
  controls.style.display = 'none'
  pushConfig({ hideControls: true })
})
document.addEventListener('dblclick', () => {
  controls.style.display = ''
  pushConfig({ hideControls: false })
})

function requestStream() {
  socket.emit(EV.VIEWER_REQUEST)
}

// Hỏi lại stream mỗi 5s cho tới khi có hình. Phải gọi lại được nhiều lần (phone
// rớt giữa chừng) nên luôn clear timer cũ trước — nếu không mỗi lần reconnect sẽ
// chồng thêm một interval nữa.
function startRetry() {
  clearInterval(retryTimer)
  retryTimer = setInterval(() => {
    if (!video.srcObject || video.readyState === 0) requestStream()
    else clearInterval(retryTimer)
  }, 5000)
}

// Chất lượng thật khác con số đặt trong config: mạng yếu thì WebRTC tự bóp bitrate
// và hạ fps. Không đo thì chỉ có thể đoán mò khi chỉnh 4/6/8 Mbps.
let lastBytes = 0, lastStatsAt = 0
function startStats() {
  clearInterval(statsTimer)
  statsTimer = setInterval(async () => {
    if (!pc) return
    try {
      const report = await pc.getStats()
      let inbound = null
      report.forEach(s => { if (s.type === 'inbound-rtp' && s.kind === 'video') inbound = s })
      if (!inbound) return

      const now = performance.now()
      let kbps = 0
      if (lastStatsAt) {
        kbps = Math.round(((inbound.bytesReceived - lastBytes) * 8) / (now - lastStatsAt))
      }
      lastBytes = inbound.bytesReceived
      lastStatsAt = now

      const w = inbound.frameWidth ?? video.videoWidth
      const h = inbound.frameHeight ?? video.videoHeight
      const fps = Math.round(inbound.framesPerSecond ?? 0)
      statsEl.textContent = `${w}×${h} · ${fps}fps · ${kbps >= 1000 ? (kbps / 1000).toFixed(1) + ' Mbps' : kbps + ' kbps'}`
    } catch (e) {
      console.warn('getStats thất bại:', e.message)
    }
  }, 2000)
}

function stopStats() {
  clearInterval(statsTimer)
  lastBytes = 0
  lastStatsAt = 0
  statsEl.textContent = ''
}

async function keepAlive() {
  // Wake Lock: chống PC ngủ khi OBS đang lấy hình. Không phải browser nào cũng có.
  try {
    if ('wakeLock' in navigator) await navigator.wakeLock.request('screen')
  } catch (e) { console.warn('Wake Lock không khả dụng:', e.name) }

  // Audio im lặng + vòng lặp WebGL: giữ tab khỏi bị throttle khi ẩn (OBS Browser
  // Source). AudioContext sinh ra ở trạng thái suspended nếu chưa có user gesture
  // → phải resume lại ở tương tác đầu tiên, không thì mẹo này vô tác dụng.
  const ctx = new AudioContext()
  const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate)
  const src = ctx.createBufferSource()
  src.buffer = buf; src.loop = true
  src.connect(ctx.destination); src.start()
  const resume = () => { if (ctx.state === 'suspended') ctx.resume() }
  document.addEventListener('visibilitychange', resume)
  document.addEventListener('click', resume)
  resume()

  const canvas = document.createElement('canvas')
  canvas.width = canvas.height = 1
  canvas.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none'
  document.body.appendChild(canvas)
  const gl = canvas.getContext('webgl')
  // gl có thể null khi WebGL bị chặn — không check thì gl.clear() ném lỗi mỗi frame
  if (gl) {
    function tick() { gl.clear(gl.COLOR_BUFFER_BIT); requestAnimationFrame(tick) }
    tick()
  } else {
    console.warn('WebGL không khả dụng — bỏ qua vòng lặp chống throttle')
  }
}
keepAlive()

socket.on('connect', () => {
  // Server tự bắn VIEWER_REQUEST hộ ngay khi join, nên không cần hỏi thêm ở đây
  socket.emit(EV.JOIN, { room: ROOM, role: ROLE.VIEWER })
  startRetry()
})

// Phone vừa vào phòng hoặc vừa bật camera → hỏi lại ngay, khỏi đợi hết chu kỳ retry
socket.on(EV.PHONE_READY, () => requestStream())

// Candidate có thể tới trước khi setRemoteDescription xong. Add sớm sẽ ném
// InvalidStateError và mất candidate luôn → phải xếp hàng rồi nạp sau.
async function flushIce() {
  const queued = pendingIce
  pendingIce = []
  for (const candidate of queued) {
    try { await pc.addIceCandidate(new RTCIceCandidate(candidate)) }
    catch (e) { console.warn('addIceCandidate (hàng đợi) thất bại:', e.message) }
  }
}

socket.on(EV.OFFER, async ({ from, sdp }) => {
  // Offer lần đầu và offer sau ICE restart đều tới đây; chỉ dựng lại connection
  // khi đúng là phiên mới, còn ICE restart thì tái dùng pc để không mất hình
  const isRestart = pc && from === phoneId && pc.connectionState !== 'closed'
  if (!isRestart) {
    if (pc) { pc.close(); pc = null }
    pendingIce = []
    pc = new RTCPeerConnection(RTC_CONFIG)
    pc.ontrack = ({ streams }) => {
      video.srcObject = streams[0]
      setStatus('🟢 Đang stream', 'live')
      startStats()
    }
    pc.onicecandidate = ({ candidate }) => {
      if (candidate) socket.emit(EV.ICE, { to: phoneId, candidate })
    }
    pc.onconnectionstatechange = () => {
      if (['disconnected', 'failed'].includes(pc.connectionState)) {
        setStatus('Mất kết nối', 'error')
        stopStats()
        startRetry()   // hỏi lại stream cho tới khi phone quay lại
      }
    }
  }
  phoneId = from

  try {
    await pc.setRemoteDescription(new RTCSessionDescription(sdp))
    await flushIce()
    const answer = await pc.createAnswer()
    await pc.setLocalDescription(answer)
    socket.emit(EV.ANSWER, { to: from, sdp: answer })
  } catch (e) {
    // Offer hỏng/lệch pha → báo rõ và quay lại vòng retry thay vì treo im lặng
    console.error('Xử lý offer thất bại:', e)
    setStatus('Lỗi bắt tay — đang thử lại', 'error')
    startRetry()
  }
})

socket.on(EV.ICE, async ({ from, candidate }) => {
  if (!pc || !pc.remoteDescription) { pendingIce.push(candidate); return }
  if (from && phoneId && from !== phoneId) return
  try { await pc.addIceCandidate(new RTCIceCandidate(candidate)) }
  catch (e) { console.warn('addIceCandidate thất bại:', e.message) }
})

socket.on(EV.CONFIG_UPDATED, () => {
  fetchConfig().then(cfg => {
    fH = cfg.flipH ?? false
    fV = cfg.flipV ?? false
    rot = cfg.rotation ?? 0
    document.getElementById('flipH').classList.toggle('active', fH)
    document.getElementById('flipV').classList.toggle('active', fV)
    controls.style.display = cfg.hideControls ? 'none' : ''
    applyTransform()
  }).catch(e => console.warn('Không tải được config:', e.message))
})

socket.on(EV.PHONE_DISCONNECTED, () => {
  setStatus('Phone mất kết nối — đang chờ', 'error')
  controls.style.display = ''
  // Bật lại vòng hỏi stream: trước đây retry đã tự tắt sau lần stream đầu tiên
  // nên phone quay lại cũng không ai yêu cầu offer mới → phải F5 thủ công
  video.srcObject = null
  phoneId = null
  stopStats()
  startRetry()
})
</script>
</body>
</html>
