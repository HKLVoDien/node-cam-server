<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>FaceCam - Viewer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥️</text></svg>">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

  video {
    width: 100vw; height: 100vh;
    object-fit: cover;
    transition: transform 0.2s;
    position: absolute;
    top: 50%; left: 50%;
    margin: 0;
    /* translate giữ element ở giữa; rotate/scale được applyTransform nối thêm */
    transform-origin: center;
  }
  /* Lớp làm mịn da: cùng một stream, blur nhẹ chồng lên bản sắc nét.
     Đây là cách gần nhất với "làm mịn" mà CSS thuần làm được — không phải
     bilateral filter thật.
     Mặc định display:none chứ không chỉ opacity:0 — blur là hiệu ứng đắt và
     lớp ẩn vẫn bị tính nếu còn nằm trong vòng render. syncSoftLayer() bật lại. */
  #videoSoft { pointer-events: none; opacity: 0; display: none; }

  #controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    align-items: center;
    background: rgba(10,10,10,0.7);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 8px 12px;
    border-radius: 20px;
    transition: opacity 0.25s;
  }
  /* Tự mờ đi khi con chuột nằm im một lúc. Đây cũng là cách thanh này biến mất
     hoàn toàn khỏi OBS: Browser Source không có con chuột nào để cử động, nên nó
     ở trạng thái idle từ khung hình đầu tiên và không bao giờ lọt vào cảnh quay. */
  #controls.idle { opacity: 0; pointer-events: none; }

  .ctrl-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,0.08);
    border: none;
    color: #ccc;
    padding: 7px 13px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.14); color: #fff; }
  .ctrl-btn.active { background: #3b82f6; color: #fff; }
  a.ctrl-btn { text-decoration: none; }

  .ctrl-divider {
    width: 1px;
    height: 24px;
    background: rgba(255,255,255,0.1);
    margin: 0 2px;
  }

  #status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #666;
    padding: 0 6px;
    white-space: nowrap;
  }
  #stats {
    font-size: 11px;
    color: #555;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: nowrap;
    padding: 0 2px;
  }
  #stats:empty { display: none; }

  #status .dot { width: 7px; height: 7px; border-radius: 50%; background: #555; flex-shrink: 0; }
  #status.live .dot { background: #22c55e; box-shadow: 0 0 6px #22c55e88; animation: pulse 2s infinite; }
  #status.error .dot { background: #ef4444; }
  #status.live { color: #fff; }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* Panel hiệu ứng — chỉnh ngay trên viewer để vừa kéo slider vừa nhìn kết quả,
     thay vì phải nhảy sang một trang cấu hình riêng */
  #fxPanel {
    display: none;
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 300px;
    max-height: 80vh;
    overflow-y: auto;
    background: rgba(10,10,10,0.82);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 14px 16px 18px;
    z-index: 30;
    font-size: 13px;
  }
  #fxPanel.open { display: block; }

  .fx-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .fx-head span { font-size: 13px; font-weight: 600; color: #fff; }
  .fx-head button {
    background: rgba(255,255,255,0.08); border: none; color: #aaa;
    width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-size: 12px;
  }
  .fx-head button:hover { background: rgba(255,255,255,0.16); color: #fff; }

  .fx-presets { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
  .fx-presets button {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
    color: #bbb; padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 12px;
  }
  .fx-presets button:hover { background: rgba(255,255,255,0.15); color: #fff; }
  /* Cùng màu với .ctrl-btn.active để "đang bật" trông giống nhau ở mọi chỗ */
  .fx-presets button.active {
    background: #3b82f6;
    border-color: #3b82f6;
    color: #fff;
  }

  .fx-row { margin-bottom: 11px; }
  .fx-row-top {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 4px;
  }
  .fx-row-top label { color: #ccc; }
  .fx-row-top .val {
    color: #777; font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .fx-row input[type=range] { width: 100%; accent-color: #3b82f6; display: block; }

  @media (max-width: 640px) {
    #fxPanel {
      right: 12px; left: 12px; width: auto;
      top: auto; bottom: 88px; transform: none;
      max-height: 60vh;
    }
  }

  .hide-btn {
    background: transparent;
    border: none;
    color: #555;
    width: 28px; height: 28px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .hide-btn:hover { background: rgba(255,255,255,0.08); color: #ccc; }

  #langSelect {
    background: rgba(255,255,255,0.08);
    border: none;
    color: #ccc;
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 8px;
    cursor: pointer;
  }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<video id="videoSoft" autoplay playsinline muted></video>

<div id="controls">
  <div id="status"><div class="dot"></div> <span data-i18n="viewer.waiting">Chờ phone...</span></div>
  <div id="stats"></div>
  <div class="ctrl-divider"></div>
  <button class="ctrl-btn" id="flipH">⇔ <span data-i18n="viewer.flipH">Lật ngang</span></button>
  <button class="ctrl-btn" id="flipV">⇕ <span data-i18n="viewer.flipV">Lật dọc</span></button>
  <button class="ctrl-btn" id="rot90" data-i18n-title="viewer.rotate">↻ 90°</button>
  <button class="ctrl-btn" id="fitBtn" data-i18n-title="viewer.fitTitle">⛶ <span id="fitLabel">Lấp đầy</span></button>
  <button class="ctrl-btn" id="fxBtn" data-i18n-title="viewer.effectsTitle">🎨 <span data-i18n="viewer.effects">Hiệu ứng</span></button>
  <button class="ctrl-btn" id="audioBtn" style="display:none" data-i18n-title="viewer.soundTitle">
    <span id="audioIcon">🔇</span> <span data-i18n="viewer.sound">Tiếng</span>
  </button>
  <div class="ctrl-divider"></div>
  <select id="langSelect" aria-label="Language"></select>
  <button class="hide-btn" id="hideBtn" data-i18n-title="viewer.hide">✕</button>
</div>

<div id="fxPanel">
  <div class="fx-head">
    <span>🎨 <span data-i18n="viewer.effects">Hiệu ứng</span></span>
    <button id="fxClose" data-i18n-title="viewer.close">✕</button>
  </div>
  <div class="fx-presets" id="fxPresets"></div>
  <div id="fxSliders"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/shared.js"></script>
<script src="/i18n.js"></script>
<script>
const { ROOM, ROLE, EV, RTC_CONFIG, FILTER_KEYS, FILTER_PRESETS, formatFilterValue, fetchConfig, saveConfig } = FaceCam
const { LANGS, t, currentLang, setLang, applyI18n } = FaceCamI18N
const socket = io()
const video = document.getElementById('video')
const videoSoft = document.getElementById('videoSoft')
const statusEl = document.getElementById('status')
const statsEl = document.getElementById('stats')

let pc = null
let phoneId = null        // socket id của phone — cần để gửi answer/ICE đích danh
let retryTimer = null
let statsTimer = null
let pendingIce = []
let playbackWatch = null
let fH = false, fV = false, rot = 0
let fit = 'cover'
let filters = { brightness: 1, contrast: 1, saturate: 1, hue: 0, grayscale: 0, sepia: 0, softness: 0, zoom: 1 }

const LAYERS = [video, videoSoft]
const fitBtn = document.getElementById('fitBtn')

// cover = lấp đầy nhưng cắt rìa. Nguồn 1080x720 trên màn 1920x1080 bị phóng
// 1.78x và mất ~25% chiều cao — nét kém hẳn. contain giữ nguyên tỉ lệ, thấy
// toàn bộ khung camera, đổi lại có viền đen.
function applyFit() {
  for (const el of LAYERS) el.style.objectFit = fit
  // Chỉ đổi phần chữ trong <span>, giữ nguyên icon — gán textContent cả nút sẽ
  // xoá mất icon và cả thẻ span mà applyI18n() cần để dịch lại
  document.getElementById('fitLabel').textContent = fit === 'cover' ? t('viewer.fill') : t('viewer.fit')
  fitBtn.classList.toggle('active', fit === 'contain')
}

function applyTransform() {
  // rotate() không đổi layout box → ở 90/270 phải hoán đổi kích thước element
  // trước khi xoay, nếu không object-fit: cover sẽ crop/kéo giãn sai khung hình
  const swap = rot === 90 || rot === 270
  const zoom = filters.zoom ?? 1
  const t = `translate(-50%, -50%) rotate(${rot}deg) scaleX(${fH ? -1 : 1}) scaleY(${fV ? -1 : 1}) scale(${zoom})`
  for (const el of LAYERS) {
    el.style.width = swap ? '100vh' : '100vw'
    el.style.height = swap ? '100vw' : '100vh'
    el.style.transform = t
  }
}

// CSS filter chạy trên GPU nên gần như không tốn gì, và OBS Browser Source render
// cả trang nên thấy kết quả ngay — không cần đụng vào stream phone gửi đi.
function applyFilter() {
  const f = filters
  const css = [
    `brightness(${f.brightness ?? 1})`,
    `contrast(${f.contrast ?? 1})`,
    `saturate(${f.saturate ?? 1})`,
    `hue-rotate(${f.hue ?? 0}deg)`,
    `grayscale(${f.grayscale ?? 0})`,
    `sepia(${f.sepia ?? 0})`,
  ].join(' ')

  video.style.filter = css
  // Lớp mịn dùng cùng bộ filter + blur, độ mờ chính là mức "làm mịn"
  videoSoft.style.filter = `${css} blur(6px)`
  videoSoft.style.opacity = f.softness ?? 0
  syncSoftLayer()
}

// Bản chỉ-video của stream, dành riêng cho lớp mịn (xem ontrack)
let softStream = null

// `opacity: 0` chỉ giấu kết quả chứ không huỷ việc: trình duyệt vẫn render lớp này
// và vẫn tính blur(6px) cho từng khung hình. Với nguồn 1080p@30fps đó là một phép
// blur toàn màn hình 30 lần mỗi giây rồi vứt đi — nghe rõ ở tiếng quạt. Chỉ
// `display: none` mới cắt hẳn khỏi vòng render.
function syncSoftLayer() {
  const on = (filters.softness ?? 0) > 0 && Boolean(softStream)
  // Phải ghi 'block' chứ không phải '': xoá inline style sẽ rơi về `display: none`
  // của quy tắc CSS mặc định, lớp mịn không bao giờ hiện lại
  videoSoft.style.display = on ? 'block' : 'none'
  const want = on ? softStream : null
  // Gán srcObject lặp lại sẽ khởi động lại pipeline video — chỉ đụng khi khác
  if (videoSoft.srcObject !== want) videoSoft.srcObject = want
}

function loadFilters(cfg) {
  filters = { ...filters, ...(cfg.filters || {}) }
  fit = cfg.fit === 'contain' ? 'contain' : 'cover'
  applyFilter()
  applyFit()
  applyTransform()   // zoom nằm trong filters nên transform phải chạy lại
  refreshFxUI()      // config đổi từ phone → slider trong panel bám theo
}

// Nhớ lại khoá đang hiển thị để vẽ lại được khi đổi ngôn ngữ giữa chừng
let statusKey = 'viewer.waiting'
let statusState = ''

function setStatus(key, state = '') {
  statusKey = key
  statusState = state
  statusEl.innerHTML = '<div class="dot"></div>'
  statusEl.append(t(key))
  statusEl.className = state
}

// Lưu xong phải báo cho phone, nếu không panel config bên đó vẫn hiện giá trị cũ
// cho tới khi người dùng tự F5
function pushConfig(patch) {
  saveConfig(patch)
    .then(() => socket.emit(EV.CONFIG_UPDATED))
    .catch(e => console.warn('Lưu config thất bại:', e.message))
}

const controls = document.getElementById('controls')

// Ẩn/hiện thanh là lựa chọn của riêng máy này, không phải thiết lập dùng chung.
// Trước đây nó ghi thẳng vào config trên server nên một người bấm ẩn là mọi viewer
// khác lẫn panel trên phone đều bị kéo theo.
const HIDE_KEY = 'facecam.hideControls'
const daLuuCucBo = localStorage.getItem(HIDE_KEY)
let hidden = daLuuCucBo === '1'
// Giá trị lần trước nhận từ phone — cần để phân biệt "phone vừa ra lệnh" với
// "phone lưu thứ khác và gửi kèm cả trường này"
let lenhAnTruocDo = null

function setHidden(v, ghiNho = true) {
  hidden = v
  if (ghiNho) {
    try { localStorage.setItem(HIDE_KEY, v ? '1' : '0') }
    catch (e) { console.warn('Không lưu được lựa chọn ẩn thanh:', e.name) }
  }
  controls.style.display = v ? 'none' : ''
  // Panel phải đóng theo, không thì nó nằm lại trên khung hình mà không còn nút
  // nào để tắt — và OBS sẽ thu luôn cả panel
  if (v) fxPanel.classList.remove('open')
  else wakeControls()
}

// Phone đổi công tắc này là một lệnh từ xa, dùng khi viewer nằm trong OBS và
// không tiện bấm. Chỉ áp khi giá trị thật sự đổi — nếu không, mỗi lần phone lưu
// bất kỳ thứ gì cũng sẽ giẫm lên lựa chọn tại chỗ của người đang xem.
function applyRemoteHide(v) {
  const val = !!v
  if (val === lenhAnTruocDo) return
  lenhAnTruocDo = val
  setHidden(val)
}

fetchConfig().then(cfg => {
  fH = cfg.flipH ?? false
  fV = cfg.flipV ?? false
  rot = cfg.rotation ?? 0
  document.getElementById('flipH').classList.toggle('active', fH)
  document.getElementById('flipV').classList.toggle('active', fV)
  lenhAnTruocDo = !!cfg.hideControls
  // Máy này chưa từng tự chọn thì mới nghe theo config; đã chọn rồi thì giữ
  if (daLuuCucBo === null) setHidden(!!cfg.hideControls, false)
  else setHidden(hidden, false)
  loadFilters(cfg)
}).catch(e => console.warn('Không tải được config:', e.message))

document.getElementById('flipH').addEventListener('click', function() {
  fH = !fH; this.classList.toggle('active', fH); applyTransform(); pushConfig({ flipH: fH })
})
document.getElementById('flipV').addEventListener('click', function() {
  fV = !fV; this.classList.toggle('active', fV); applyTransform(); pushConfig({ flipV: fV })
})
document.getElementById('rot90').addEventListener('click', function() {
  rot = (rot + 90) % 360; applyTransform(); pushConfig({ rotation: rot })
})
fitBtn.addEventListener('click', () => {
  fit = fit === 'cover' ? 'contain' : 'cover'
  applyFit(); pushConfig({ fit })
})

// ── Panel hiệu ứng ──────────────────────────────────────────────────────────
// Áp filter ngay tại chỗ rồi mới lưu, nên kéo slider là thấy đổi tức thì —
// không phải chờ một vòng qua server rồi mới thấy hình đổi
const fxPanel = document.getElementById('fxPanel')
const fxSliders = document.getElementById('fxSliders')

// Giữ lại dải giá trị server gửi về để dựng lại panel khi đổi ngôn ngữ
let fxRanges = null

function buildFxPanel(ranges) {
  fxRanges = ranges
  fxSliders.innerHTML = ''
  // Duyệt theo FILTER_KEYS chứ không theo thứ tự key của object: thứ tự slider
  // là quyết định về giao diện, không nên phụ thuộc thứ tự server trả về
  for (const key of FILTER_KEYS) {
    const range = ranges[key]
    if (!range) continue
    const [min, max] = range
    const row = document.createElement('div')
    row.className = 'fx-row'
    row.innerHTML = `
      <div class="fx-row-top">
        <label for="fx-${key}" data-i18n="filter.${key}"></label>
        <span class="val" id="fxval-${key}"></span>
      </div>
      <input type="range" id="fx-${key}" data-filter="${key}"
             min="${min}" max="${max}" step="${key === 'hue' ? 1 : 0.01}">`
    fxSliders.appendChild(row)

    const input = row.querySelector('input')
    input.addEventListener('input', () => {
      filters[key] = Number(input.value)
      applyFilter()
      if (key === 'zoom') applyTransform()
      document.getElementById(`fxval-${key}`).textContent = formatFilterValue(key, filters[key])
      refreshPresetActive()
      queueFilterSave()
    })
  }

  const fxPresets = document.getElementById('fxPresets')
  fxPresets.innerHTML = ''
  for (const id of Object.keys(FILTER_PRESETS)) {
    const btn = document.createElement('button')
    // Khoá preset là định danh tiếng Anh, tên hiển thị tra qua i18n
    btn.dataset.i18n = `preset.${id}`
    btn.dataset.preset = id
    btn.addEventListener('click', () => {
      filters = { ...filters, ...FILTER_PRESETS[id] }
      applyFilter(); applyTransform(); refreshFxUI()
      pushConfig({ filters })
    })
    fxPresets.appendChild(btn)
  }
  applyI18n(fxPanel)
  refreshFxUI()
}

// Preset cố tình không khai báo `zoom` (trừ 'none'), nên chỉ đối chiếu những khoá
// nó thật sự đặt — so cả zoom thì canh khung xong là mọi preset đều trông như
// chưa từng được chọn. So bằng epsilon vì đây toàn số thực.
function dangDungPreset(id) {
  const p = FILTER_PRESETS[id]
  return Object.keys(p).every(k => Math.abs((filters[k] ?? 0) - p[k]) < 1e-6)
}

function refreshFxUI() {
  for (const key of FILTER_KEYS) {
    const input = document.getElementById(`fx-${key}`)
    const val = document.getElementById(`fxval-${key}`)
    if (input && filters[key] !== undefined) input.value = filters[key]
    if (val && filters[key] !== undefined) val.textContent = formatFilterValue(key, filters[key])
  }
  refreshPresetActive()
}

// Tách khỏi refreshFxUI để gọi được trong lúc kéo slider: refreshFxUI ghi lại
// value của mọi input, chạm vào cái đang kéo là dễ giật.
// Tự chỉnh tay là lệch khỏi mọi preset — lúc đó không nút nào sáng, đúng thực tế
// chứ không để một nút sáng gây hiểu nhầm.
function refreshPresetActive() {
  for (const btn of document.querySelectorAll('#fxPresets button')) {
    btn.classList.toggle('active', dangDungPreset(btn.dataset.preset))
  }
}

// Kéo slider bắn hàng chục event mỗi giây — gom lại rồi mới ghi đĩa và báo
// các trang khác, nhưng hình trên màn hình vẫn đổi ngay từng frame
let fxSaveTimer = null
function queueFilterSave() {
  clearTimeout(fxSaveTimer)
  fxSaveTimer = setTimeout(() => pushConfig({ filters }), 300)
}

document.getElementById('fxBtn').addEventListener('click', () => fxPanel.classList.toggle('open'))
document.getElementById('fxClose').addEventListener('click', () => fxPanel.classList.remove('open'))

// ── Ngôn ngữ ────────────────────────────────────────────────────────────────
const langSelect = document.getElementById('langSelect')
for (const [code, name] of Object.entries(LANGS)) {
  langSelect.add(new Option(name, code, false, code === currentLang()))
}
langSelect.addEventListener('change', () => setLang(langSelect.value))

// applyI18n chỉ dịch được phần đánh dấu data-i18n trong HTML tĩnh; dòng trạng
// thái và nhãn nút "lấp đầy/vừa khung" do JS ghi nên phải tự vẽ lại
addEventListener('fc:langchange', () => {
  setStatus(statusKey, statusState)
  applyFit()
})

applyI18n()

fetch('/api/filter-ranges').then(r => r.json()).then(buildFxPanel)
  .catch(e => console.warn('Không tải được dải filter:', e.message))
document.getElementById('hideBtn').addEventListener('click', () => setHidden(true))
document.addEventListener('dblclick', () => setHidden(false))

// Thanh tự mờ sau vài giây không ai đụng vào. Trong OBS Browser Source không có
// con chuột nào cử động, nên nó nằm im ở trạng thái idle và không lọt vào cảnh
// quay — không cần ai nhớ bấm ẩn trước khi lên sóng.
const IDLE_MS = 2500
let idleTimer = null

function wakeControls() {
  if (hidden) return   // đã ẩn hẳn thì tôn trọng, đừng dựng dậy
  controls.classList.remove('idle')
  clearTimeout(idleTimer)
  idleTimer = setTimeout(function nguNeuRanh() {
    // Panel hiệu ứng đang mở nghĩa là người dùng vẫn đang chỉnh dở — hoãn lại
    if (fxPanel.classList.contains('open')) {
      idleTimer = setTimeout(nguNeuRanh, IDLE_MS)
      return
    }
    controls.classList.add('idle')
  }, IDLE_MS)
}

// Bắt đầu ở trạng thái idle: OBS sạch ngay từ khung hình đầu, còn người ngồi
// trước máy chỉ cần khẽ động chuột là thanh hiện ra
controls.classList.add('idle')
for (const ev of ['mousemove', 'mousedown', 'touchstart', 'keydown']) {
  document.addEventListener(ev, wakeControls, { passive: true })
}

// ── Tiếng từ mic điện thoại ─────────────────────────────────────────────────
// Trình duyệt chặn autoplay video có tiếng, nên không thể tự bỏ câm khi nhận
// stream — bắt buộc phải do người dùng bấm. Nút chỉ hiện khi phone thật sự gửi
// audio track, để không bày ra một nút bấm vào không có gì xảy ra.
const audioBtn = document.getElementById('audioBtn')

function syncAudioBtn() {
  // Chỉ đổi icon, không đụng tới phần chữ: gán textContent cho cả nút sẽ xoá mất
  // thẻ <span data-i18n> bên trong, và từ đó nút kẹt tiếng Việt vĩnh viễn dù có
  // đổi ngôn ngữ
  document.getElementById('audioIcon').textContent = video.muted ? '🔇' : '🔊'
  audioBtn.classList.toggle('active', !video.muted)
}

function refreshAudioBtn(stream) {
  const hasAudio = (stream?.getAudioTracks().length ?? 0) > 0
  audioBtn.style.display = hasAudio ? '' : 'none'
  // Phone tắt mic giữa chừng → câm lại, nếu không lần bật mic sau sẽ phát tiếng
  // đột ngột mà nút vẫn hiển thị đúng trạng thái cũ
  if (!hasAudio) video.muted = true
  syncAudioBtn()
}

audioBtn.addEventListener('click', () => {
  video.muted = !video.muted
  // Một số trình duyệt tạm dừng video khi bị bỏ câm, kể cả khi thao tác xuất phát
  // từ cú click. Gọi lại play() là biện pháp rẻ và không gây hại nếu đang chạy.
  video.play().catch(e => console.warn('play() sau khi bỏ câm thất bại:', e.name))
  syncAudioBtn()
})

function requestStream() {
  socket.emit(EV.VIEWER_REQUEST)
}

// Hỏi lại stream mỗi 5s cho tới khi có hình. Phải gọi lại được nhiều lần (phone
// rớt giữa chừng) nên luôn clear timer cũ trước — nếu không mỗi lần reconnect sẽ
// chồng thêm một interval nữa.
function startRetry() {
  clearInterval(retryTimer)
  retryTimer = setInterval(() => {
    if (!video.srcObject || video.readyState === 0) requestStream()
    else clearInterval(retryTimer)
  }, 5000)
}

// Chất lượng thật khác con số đặt trong config: mạng yếu thì WebRTC tự bóp bitrate
// và hạ fps. Không đo thì chỉ có thể đoán mò khi chỉnh 4/6/8 Mbps.
let lastBytes = 0, lastStatsAt = 0
function startStats() {
  clearInterval(statsTimer)
  statsTimer = setInterval(async () => {
    if (!pc) return
    try {
      const report = await pc.getStats()
      let inbound = null
      report.forEach(s => { if (s.type === 'inbound-rtp' && s.kind === 'video') inbound = s })
      if (!inbound) return

      const now = performance.now()
      let kbps = 0
      if (lastStatsAt) {
        kbps = Math.round(((inbound.bytesReceived - lastBytes) * 8) / (now - lastStatsAt))
      }
      lastBytes = inbound.bytesReceived
      lastStatsAt = now

      const w = inbound.frameWidth ?? video.videoWidth
      const h = inbound.frameHeight ?? video.videoHeight
      const fps = Math.round(inbound.framesPerSecond ?? 0)
      statsEl.textContent = `${w}×${h} · ${fps}fps · ${kbps >= 1000 ? (kbps / 1000).toFixed(1) + ' Mbps' : kbps + ' kbps'}`
    } catch (e) {
      console.warn('getStats thất bại:', e.message)
    }
  }, 2000)
}

function stopStats() {
  clearInterval(statsTimer)
  clearTimeout(playbackWatch)
  stopAliveLoop()
  lastBytes = 0
  lastStatsAt = 0
  statsEl.textContent = ''
}

// Bắt tay signaling xong mà hình vẫn đen là triệu chứng của hai lỗi hoàn toàn
// khác nhau — ICE không ghép được đường truyền, hay có luồng nhưng không phát
// được. Nói "Mất kết nối" cho cả hai thì không debug được gì.
function watchPlayback() {
  clearTimeout(playbackWatch)
  playbackWatch = setTimeout(() => {
    if (!pc || pc.connectionState !== 'connected') return
    if (video.readyState === 0) {
      setStatus('viewer.playbackStuck', 'error')
      console.warn('ontrack đã chạy nhưng video.readyState vẫn 0 sau 5s.',
        'Thường do autoplay policy hoặc track không có dữ liệu.')
    }
  }, 5000)
}

// Nói rõ ICE hỏng ở đâu. `failed` gần như luôn nghĩa là hai máy không có đường
// đi trực tiếp: khác subnet, AP isolation, hoặc mở viewer trên chính điện thoại
// đang gửi (gói phải vòng qua router rồi quay lại — nhiều router làm hỏng).
// Trả về khoá i18n, không phải câu chữ — setStatus lo phần dịch.
function describeIceFailure(state) {
  if (state === 'failed') return 'viewer.iceFailed'
  if (state === 'disconnected') return 'viewer.iceDisconnected'
  return 'viewer.disconnected'
}

// Khai báo trước keepAlive(): khi trình duyệt không có Wake Lock thì thân hàm
// async chạy thẳng một mạch, chạm tới `gl` ngay trong lượt đồng bộ này
let gl = null
let aliveRaf = null

async function keepAlive() {
  // Wake Lock: chống PC ngủ khi OBS đang lấy hình. Không phải browser nào cũng có.
  try {
    if ('wakeLock' in navigator) await navigator.wakeLock.request('screen')
  } catch (e) { console.warn('Wake Lock không khả dụng:', e.name) }

  // Audio im lặng + vòng lặp WebGL: giữ tab khỏi bị throttle khi ẩn (OBS Browser
  // Source). AudioContext sinh ra ở trạng thái suspended nếu chưa có user gesture
  // → phải resume lại ở tương tác đầu tiên, không thì mẹo này vô tác dụng.
  const ctx = new AudioContext()
  const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate)
  const src = ctx.createBufferSource()
  src.buffer = buf; src.loop = true
  src.connect(ctx.destination); src.start()
  const resume = () => { if (ctx.state === 'suspended') ctx.resume() }
  document.addEventListener('visibilitychange', resume)
  document.addEventListener('click', resume)
  resume()

  const canvas = document.createElement('canvas')
  canvas.width = canvas.height = 1
  canvas.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none'
  document.body.appendChild(canvas)
  gl = canvas.getContext('webgl')
  // gl có thể null khi WebGL bị chặn — không check thì gl.clear() ném lỗi mỗi frame
  if (!gl) console.warn('WebGL không khả dụng — bỏ qua vòng lặp chống throttle')
}
keepAlive()

// Vòng lặp này tồn tại để giữ tab khỏi bị throttle khi đang tải hình cho OBS.
// Nó chạy 60 lần/giây và không bao giờ để CPU rơi vào trạng thái nghỉ, nên chỉ
// đáng bật đúng lúc có việc — trước đây nó chạy ngay từ khi mở trang và tiếp tục
// cả khi phone đã ngắt, quạt laptop kêu suốt dù màn hình chẳng có gì.
function startAliveLoop() {
  if (aliveRaf !== null || !gl) return
  const tick = () => {
    gl.clear(gl.COLOR_BUFFER_BIT)
    aliveRaf = requestAnimationFrame(tick)
  }
  tick()
}

function stopAliveLoop() {
  if (aliveRaf === null) return
  cancelAnimationFrame(aliveRaf)
  aliveRaf = null
}

socket.on('connect', () => {
  // Server tự bắn VIEWER_REQUEST hộ ngay khi join, nên không cần hỏi thêm ở đây
  socket.emit(EV.JOIN, { room: ROOM, role: ROLE.VIEWER })
  startRetry()
})

// Phone vừa vào phòng hoặc vừa bật camera → hỏi lại ngay, khỏi đợi hết chu kỳ retry
socket.on(EV.PHONE_READY, () => requestStream())

// Candidate có thể tới trước khi setRemoteDescription xong. Add sớm sẽ ném
// InvalidStateError và mất candidate luôn → phải xếp hàng rồi nạp sau.
async function flushIce() {
  const queued = pendingIce
  pendingIce = []
  for (const candidate of queued) {
    try { await pc.addIceCandidate(new RTCIceCandidate(candidate)) }
    catch (e) { console.warn('addIceCandidate (hàng đợi) thất bại:', e.message) }
  }
}

socket.on(EV.OFFER, async ({ from, sdp, iceRestart }) => {
  // Ba loại offer cùng tới đây: lần đầu, sau ICE restart, và sau khi phone dựng
  // lại peer connection (bật/tắt mic làm đổi cấu trúc SDP nên buộc phải chào hỏi
  // lại từ đầu).
  //
  // Chỉ ICE restart mới được tái dùng `pc` — nó vẫn là cùng một connection, chỉ
  // đổi đường truyền. Hai loại kia mang SDP của một connection khác hẳn; nhét
  // vào `pc` cũ là hỏng luồng và người dùng phải F5.
  //
  // Trước đây chỗ này chỉ so `from`, mà cả ba loại đều mang cùng socket id của
  // phone — nên bật mic là mất hình.
  const isRestart = iceRestart && pc && from === phoneId && pc.connectionState !== 'closed'
  if (!isRestart) {
    if (pc) { pc.close(); pc = null }
    pendingIce = []
    pc = new RTCPeerConnection(RTC_CONFIG)
    pc.ontrack = ({ streams }) => {
      // Cả hai lớp dùng chung một MediaStream — không tốn thêm băng thông hay
      // decode, chỉ là hai element cùng vẽ một nguồn
      video.srcObject = streams[0]
      // Lớp mịn chỉ nhận video track. Trước đây nó dùng chung cả MediaStream nên
      // mang theo audio — vô hại vì element đang câm, nhưng chỉ cần một lần lỡ
      // tay bỏ câm là nghe hai luồng chồng nhau. Cắt hẳn audio ra thì không còn
      // phải dựa vào chuyện đó nữa.
      softStream = new MediaStream(streams[0].getVideoTracks())
      // Chỉ thật sự gắn vào element khi người dùng có bật độ mịn
      syncSoftLayer()
      // ontrack chạy một lần cho mỗi track — audio có thể tới sau video, nên phải
      // kiểm tra lại ở cả hai lần chứ không chỉ lần đầu
      refreshAudioBtn(streams[0])
      // Không thêm emoji 🟢 vào text: .dot đã là chấm xanh do CSS vẽ, thêm nữa
      // là thành hai chấm cạnh nhau
      setStatus('viewer.streaming', 'live')
      startStats()
      startAliveLoop()   // từ đây mới có hình để giữ, trước đó giữ cũng vô nghĩa
      watchPlayback()
    }
    pc.onicecandidate = ({ candidate }) => {
      if (candidate) socket.emit(EV.ICE, { to: phoneId, candidate })
    }
    pc.onconnectionstatechange = () => {
      // Sau ICE restart, hình quay lại mà ontrack không bắn thêm lần nào — bật lại
      // ở đây, nếu không vòng giữ tab đã tắt lúc 'disconnected' sẽ không ai mở lại
      if (pc.connectionState === 'connected' && video.srcObject) startAliveLoop()
      if (['disconnected', 'failed'].includes(pc.connectionState)) {
        setStatus(describeIceFailure(pc.iceConnectionState), 'error')
        stopStats()
        clearTimeout(playbackWatch)
        startRetry()   // hỏi lại stream cho tới khi phone quay lại
      }
    }
    // Trong lúc chưa có hình thì ô stats để trống — mượn nó hiện tiến trình ICE
    // để biết đang kẹt ở bước nào
    pc.oniceconnectionstatechange = () => {
      if (!video.srcObject) statsEl.textContent = `ICE: ${pc.iceConnectionState}`
      if (pc.iceConnectionState === 'failed') {
        console.warn('ICE failed. iceServers rỗng nên chỉ ghép được bằng host candidate —',
          'phone và máy này phải cùng subnet, không bật AP isolation.')
      }
    }
  }
  phoneId = from

  try {
    await pc.setRemoteDescription(new RTCSessionDescription(sdp))
    await flushIce()
    const answer = await pc.createAnswer()
    await pc.setLocalDescription(answer)
    socket.emit(EV.ANSWER, { to: from, sdp: answer })
  } catch (e) {
    // Offer hỏng/lệch pha → báo rõ và quay lại vòng retry thay vì treo im lặng
    console.error('Xử lý offer thất bại:', e)
    setStatus('viewer.handshakeError', 'error')
    startRetry()
  }
})

socket.on(EV.ICE, async ({ from, candidate }) => {
  if (!pc || !pc.remoteDescription) { pendingIce.push(candidate); return }
  if (from && phoneId && from !== phoneId) return
  try { await pc.addIceCandidate(new RTCIceCandidate(candidate)) }
  catch (e) { console.warn('addIceCandidate thất bại:', e.message) }
})

socket.on(EV.CONFIG_UPDATED, () => {
  fetchConfig().then(cfg => {
    fH = cfg.flipH ?? false
    fV = cfg.flipV ?? false
    rot = cfg.rotation ?? 0
    document.getElementById('flipH').classList.toggle('active', fH)
    document.getElementById('flipV').classList.toggle('active', fV)
    applyRemoteHide(cfg.hideControls)
    loadFilters(cfg)
  }).catch(e => console.warn('Không tải được config:', e.message))
})

socket.on(EV.PHONE_DISCONNECTED, () => {
  setStatus('viewer.phoneLost', 'error')
  // Cố tình KHÔNG dựng thanh điều khiển dậy ở đây. Phone rớt một nhịp giữa buổi
  // ghi hình là chuyện thường, mà thanh tự nhảy vào giữa cảnh quay thì hỏng cả
  // đoạn. Muốn thấy lại thì chạm đúp — vẫn luôn có lối ra.
  // Bật lại vòng hỏi stream: trước đây retry đã tự tắt sau lần stream đầu tiên
  // nên phone quay lại cũng không ai yêu cầu offer mới → phải F5 thủ công
  video.srcObject = null
  softStream = null
  syncSoftLayer()
  refreshAudioBtn(null)
  phoneId = null
  stopStats()
  startRetry()
})
</script>
</body>
</html>
